<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>登录</title>
    </head>
    <body>
        <header>
        </header>
        <main>
            <div id="right" style="height:auto;width:50%;float:left" align="center">
                <img src="assets/images/banner.jpg" width="100%" height="500px" alt="banner"/>
            </div>
            <div id="left" style="height:100%;width:50%;float:left" align="center">
                <h1>登录</h1>
                <p>如果您还没有账号，请先注册</p>
                <form action="#" method="post">
                    <h2>
                        <label for="nickname">昵称：</label>
                        <input type="text" id="nickname"  name="nickname" required
                                placeholder="请输出昵称" autocomplete="nickname">
                    </h2>
                    <h2>
                        <label for="password">密码：</label>
                        <input type="password" id="password" name="password"
                                placeholder="请输入密码" required
                                autocomplete="new-password">
                    </h2>
                    <p>
                        <button type="submit">登录</button>
                        <a href="register.html"><button type="button">注册</button></a>
                    </p>
                </form>
                <hr width="90%"/>
                <p>忘记密码？请联系管理员</p>
                <a href="index.html"><img src="assets/images/logo.png" width="380px" height="80px" alt="logo"/></a>
            </div>
        </main>
    </body>
</html>
